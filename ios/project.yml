name: Photos
options:
  bundleIdPrefix: de.baucas.photos
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

targets:
  Photos:
    type: application
    platform: iOS
    sources:
      - path: Photos
    info:
      path: Photos/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Photos braucht Zugriff auf deine Mediathek, um neue Fotos und Videos automatisch auf deinen NAS-Server zu sichern."
        NSPhotoLibraryAddUsageDescription: "Photos kann heruntergeladene Fotos in deiner Mediathek speichern."
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - de.baucas.photos.backup-refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.baucas.photos
        # The module can't be named "Photos" too: Apple's PhotosKit framework
        # is also called Photos, and a same-named module shadows it, making
        # `import Photos` (PHAsset, PHAuthorizationStatus, ...) invisible.
        PRODUCT_MODULE_NAME: PhotosApp
        PRODUCT_NAME: Photos
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
